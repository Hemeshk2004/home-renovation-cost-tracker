<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home Renovation Cost Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBHeNg-1eOlb_4dzHhrxtDcZLeq9aqBsgg",
  authDomain:"renovation-942d6.firebaseapp.com",
  projectId:"renovation-942d6",
  storageBucket:"renovation-942d6.firebasestorage.app",
  messagingSenderId:"499990278903",
  appId:"1:499990278903:web:d4b69910c86e91cd35d9f2",
  measurementId:"G-67G2870E08"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

signInAnonymously(auth).then(async () => {
  window.fbDb = db;
  window.dispatchEvent(new Event("firebase-ready"));
}).catch(err => {
  console.error(err);
  window.dispatchEvent(new Event("firebase-error"));
});
</script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f7fb;font-family:Arial,sans-serif;color:#172033}
header{background:#111827;color:white;padding:22px}
.wrap{max-width:1180px;margin:auto;padding:20px}
h1{margin:0;font-size:24px}
header p{margin:6px 0 0;color:#cbd5e1}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:18px}
.metric{font-size:27px;font-weight:bold;margin-top:7px}
.label{font-size:12px;color:#6b7280}
.blue{color:#2563eb}.green{color:#16a34a}
.note{padding:13px;background:#eff6ff;color:#1e40af;border-radius:10px;margin-bottom:15px}
.tabs{display:flex;gap:8px;margin:20px 0}
.tabs button,.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer}
.tabs button{background:white;border:1px solid #ddd}.tabs button.active{background:#111827;color:white}
.panel{display:none}.panel.active{display:block}
.formgrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:9px;align-items:end}
label{display:block;font-size:12px;color:#6b7280;margin-bottom:5px}
input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:9px}
.primary{background:#2563eb;color:white}.secondary{background:#e5e7eb}.danger{background:#fee2e2;color:#991b1b}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:12px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}
.right{text-align:right!important}.chartbox{height:320px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}
</style>
</head>

<body>
<header>
<div class="wrap">
<h1>🏠 Home Renovation Cost Tracker</h1>
<p>Shared family renovation expense tracker</p>
</div>
</header>

<main class="wrap">
<div class="note">
Budget: <b id="budgetText">₹4,71,000</b> ·
<b id="cloudStatus">☁️ Connecting to Firebase…</b>
</div>

<section class="grid">
<div class="card"><div class="label">TOTAL BUDGET</div><div class="metric blue" id="budgetMetric">₹4,71,000</div></div>
<div class="card"><div class="label">SPENT</div><div class="metric" id="spentMetric">₹0</div></div>
<div class="card"><div class="label">REMAINING</div><div class="metric green" id="remainingMetric">₹0</div></div>
<div class="card"><div class="label">EXPENSES</div><div class="metric" id="countMetric">0</div></div>
</section>

<div class="tabs">
<button class="active" data-tab="dashboard">Dashboard</button>
<button data-tab="expenses">Expenses</button>
<button data-tab="settings">Settings</button>
</div>

<section id="dashboard" class="panel active">
<div class="grid" style="grid-template-columns:1.3fr 1fr">
<div class="card"><h3>Spending by category</h3><div class="chartbox"><canvas id="pie"></canvas></div></div>
<div class="card"><h3>Category summary</h3><div id="summary"></div></div>
</div>
<div class="card" style="margin-top:14px"><h3>Largest expenses</h3><div id="largest"></div></div>
</section>

<section id="expenses" class="panel">
<div class="card">
<h3>Add expense</h3>
<form id="expenseForm">
<div class="formgrid">
<div><label>Description</label><input id="desc" required></div>
<div><label>Amount (₹)</label><input id="amount" type="number" min="0" required></div>
<div><label>Category</label><select id="category"><option>Materials</option><option>Labour</option><option>Machinery</option><option>Food</option><option>Transport</option><option>Other</option></select></div>
<div><label>Date</label><input id="date" type="date"></div>
<button class="btn primary">Add</button>
</div>
</form>
</div>

<div class="card" style="margin-top:14px">
<div class="toolbar">
<input id="search" placeholder="Search expenses…">
<select id="filter"><option value="all">All categories</option><option>Materials</option><option>Labour</option><option>Machinery</option><option>Food</option><option>Transport</option><option>Other</option></select>
<button class="btn secondary" id="export">Export JSON</button>
</div>
<div class="table-wrap">
<table class="table">
<thead><tr><th>Description</th><th>Category</th><th>Date</th><th class="right">Amount</th><th></th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
</div>
</section>

<section id="settings" class="panel">
<div class="card">
<h3>Project settings</h3>
<label>Renovation budget (₹)</label>
<input id="budgetInput" type="number" value="471000" style="max-width:300px">
<button class="btn primary" id="saveBudget">Save budget</button>
</div>
</section>
</main>

<script>
const initial=[
["Milk",100,"Food","2026-09-22"],
["Kambi",62500,"Materials","2026-09-21"],
["MSand (4 unit)",17500,"Materials","2026-09-22"],
["3/4 Jalli (4 unit)",13000,"Materials","2026-09-22"],
["Drilling",7000,"Labour","2026-09-20"],
["1/2 Jalli (1 unit)",4500,"Materials","2026-09-22"],
["JCB Demolish",2500,"Machinery","2026-09-21"],
["Kattai",1500,"Materials","2026-09-22"],
["Green Cover",1100,"Materials","2026-09-22"],
["Kattu Kambi",500,"Materials","2026-09-22"],
["Breakfast",500,"Food","2026-09-22"],
["Lunch",500,"Food","2026-09-22"],
["Bricks",16500,"Materials","2026-09-22"],
["Labour Charge",6000,"Labour","2026-09-22"],
["Cement",10500,"Materials","2026-09-23"],
["Kattu Kambi",1000,"Materials","2026-09-23"],
["Breakfast",500,"Food","2026-09-23"]
].map((x,i)=>({id:"i"+i,desc:x[0],amount:x[1],category:x[2],date:x[3]}));

let data=initial.map(x=>({...x}));
let budget=471000;
let chart=null;
let cloudReady=false;
let pending=false;

const money=n=>"₹"+Number(n).toLocaleString("en-IN");

function esc(s){
 return String(s).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
}

async function save(){
 if(!cloudReady)return;
 pending=true;
 await setDoc(doc(window.fbDb,"renovation","shared"),{expenses:data,budget},{merge:true});
 pending=false;
}

function render(){
 const spent=data.reduce((s,x)=>s+Number(x.amount),0);
 document.getElementById("budgetMetric").textContent=money(budget);
 document.getElementById("spentMetric").textContent=money(spent);
 document.getElementById("remainingMetric").textContent=money(budget-spent);
 document.getElementById("countMetric").textContent=data.length;
 document.getElementById("budgetText").textContent=money(budget);

 const q=document.getElementById("search").value.toLowerCase();
 const f=document.getElementById("filter").value;
 const rows=data.filter(x=>
   (!q||x.desc.toLowerCase().includes(q)||x.category.toLowerCase().includes(q)) &&
   (f==="all"||x.category===f)
 );

 document.getElementById("tbody").innerHTML=rows.map(x=>
 `<tr><td>${esc(x.desc)}</td><td>${x.category}</td><td>${x.date}</td>
 <td class="right"><b>${money(x.amount)}</b></td>
 <td><button class="btn danger" onclick="removeExpense('${x.id}')">Delete</button></td></tr>`
 ).join("")||"<tr><td colspan='5'>No expenses found.</td></tr>";

 const cats={};
 data.forEach(x=>cats[x.category]=(cats[x.category]||0)+Number(x.amount));

 if(chart)chart.destroy();
 chart=new Chart(document.getElementById("pie"),{
  type:"doughnut",
  data:{labels:Object.keys(cats),datasets:[{data:Object.values(cats)}]},
  options:{responsive:true,maintainAspectRatio:false}
 });

 document.getElementById("summary").innerHTML=Object.entries(cats)
 .sort((a,b)=>b[1]-a[1])
 .map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee"><span>${k}</span><b>${money(v)}</b></div>`).join("");

 document.getElementById("largest").innerHTML=[...data]
 .sort((a,b)=>b.amount-a.amount).slice(0,6)
 .map(x=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee"><span>${esc(x.desc)}</span><b>${money(x.amount)}</b></div>`).join("");
}

async function removeExpense(id){
 data=data.filter(x=>x.id!==id);
 await save();
 render();
}

document.querySelectorAll(".tabs button").forEach(b=>{
 b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.getElementById(b.dataset.tab).classList.add("active");
 };
});

document.getElementById("expenseForm").onsubmit=async e=>{
 e.preventDefault();
 data.push({
  id:Date.now().toString(),
  desc:document.getElementById("desc").value.trim(),
  amount:Number(document.getElementById("amount").value),
  category:document.getElementById("category").value,
  date:document.getElementById("date").value
 });
 await save();
 e.target.reset();
 render();
};

document.getElementById("search").oninput=render;
document.getElementById("filter").onchange=render;

document.getElementById("saveBudget").onclick=async()=>{
 budget=Number(document.getElementById("budgetInput").value||0);
 await save();
 render();
};

document.getElementById("export").onclick=()=>{
 const blob=new Blob([JSON.stringify({budget,expenses:data},null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="home-renovation-costs.json";
 a.click();
};

window.addEventListener("firebase-ready",async()=>{
 const ref=doc(window.fbDb,"renovation","shared");
 const snap=await getDoc(ref);

 if(!snap.exists()){
   await setDoc(ref,{expenses:data,budget});
 }else{
   const v=snap.data();
   data=Array.isArray(v.expenses)?v.expenses:initial.map(x=>({...x}));
   budget=Number(v.budget??471000);
 }

 cloudReady=true;
 document.getElementById("budgetInput").value=budget;
 document.getElementById("cloudStatus").textContent="☁️ Firebase connected";
 render();

 onSnapshot(ref,s=>{
   if(s.exists()&&!pending){
     const v=s.data();
     data=Array.isArray(v.expenses)?v.expenses:data;
     budget=Number(v.budget??budget);
     document.getElementById("budgetInput").value=budget;
     render();
   }
 });
});

window.addEventListener("firebase-error",()=>{
 document.getElementById("cloudStatus").textContent="⚠️ Firebase connection failed";
});

render();
</script>
</body>
</html>
